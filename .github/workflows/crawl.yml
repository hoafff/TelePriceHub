name: TelePriceHub — Cloud Crawler
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
  push:
    branches: [main, fix/cloud-ready-20261027]
    paths:
      - 'teleprice/**'
      - 'tests/**'
      - 'main.py'
      - 'requirements.txt'
      - '.github/workflows/crawl.yml'
permissions:
  contents: read
concurrency:
  group: telegram-price-crawl
  cancel-in-progress: false
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python main.py test

  crawl:
    # Do not crawl on every code push; run only on schedule/manual dispatch.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
      TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
      TELEGRAM_STRING_SESSION: ${{ secrets.TELEGRAM_STRING_SESSION }}
      SUPPLIER_BOTS: ${{ vars.SUPPLIER_BOTS }}
      WORKER_SYNC_URL: ${{ secrets.WORKER_URL }}
      SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
      DB_PATH: teleprice.db
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Require all connection secrets
        run: |
          for key in TELEGRAM_API_ID TELEGRAM_API_HASH TELEGRAM_STRING_SESSION SUPPLIER_BOTS WORKER_SYNC_URL SYNC_TOKEN; do
            if [ -z "$\\{!key}" ]; then
              echo "::error::Missing $key — configure repository secrets/variables first."
              exit 1
            fi
          done
        shell: bash
      - name: Crawl all suppliers, using fresh state each run
        run: python main.py crawl
      - name: Publish snapshot to persistent Cloudflare D1
        run: python main.py sync
