name: TelePriceHub Crawler & Price Sync

on:
  schedule:
    # Chạy mỗi 6 tiếng một lần (UTC)
    - cron: '0 */6 * * *'
  workflow_dispatch: # Cho phép kích hoạt thủ công từ giao diện GitHub

jobs:
  crawl_and_sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run verification tests
        run: |
          python main.py test

      - name: Run Crawler
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_STRING_SESSION: ${{ secrets.TELEGRAM_STRING_SESSION }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          SUPPLIER_BOTS: ${{ vars.SUPPLIER_BOTS }}
          DB_PATH: "teleprice.db"
        run: |
          # Nếu có cấu hình StringSession thì chạy crawl thật, ngược lại chạy mock test
          if [ -n "$TELEGRAM_STRING_SESSION" ]; then
            python main.py crawl
          else
            echo "TELEGRAM_STRING_SESSION chưa cấu hình. Chạy mock crawl để kiểm tra đường ống..."
            python main.py crawl --mock
          fi
          python main.py report

      - name: Upload Database Artifact
        uses: actions/upload-artifact@v4
        with:
          name: teleprice-sqlite-db
          path: teleprice.db
          retention-days: 14
